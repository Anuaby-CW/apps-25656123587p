name: talaga_coffee_pos
description: "Offline-first Android POS for Talaga Coffee cafe and coffee shop operations."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  drift: ^2.34.1
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.1
  path_provider: ^2.1.6
  intl: ^0.20.2
  uuid: ^4.5.3
  crypto: ^3.0.7
  shared_preferences: ^2.5.5
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.2.2
  collection: ^1.19.1
  fl_chart: ^1.2.0
  pdf: ^3.13.0
  share_plus: ^13.2.1
  image: ^4.9.1
  device_preview: ^1.3.1
  firebase_core: ^4.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/talaga_logo.png
    - assets/images/talaga_logo_thermal.png

flutter_launcher_icons:
  android: "ic_launcher"
  image_path_android: "assets/images/talaga_logo.png"
  min_sdk_android: 24
  adaptive_icon_background: "#FFFBF7"
  adaptive_icon_foreground: "assets/images/talaga_logo_foreground.png"
  adaptive_icon_foreground_inset: 0
